function ub(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function bu(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
async function openWithKey(raw){
 var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},k,ub(D.ct));
 var html=new TextDecoder().decode(pt);
 document.open();document.write(html);document.close();
}
async function tryLogin(u,p){
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+'\n'+p),'PBKDF2',false,['deriveKey']);
 for(var i=0;i<D.w.length;i++){
  var w=D.w[i];
  var kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(w.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(w.i)},kek,ub(w.k)))}catch(e){}
 }
 return null;
}
var KEY='rashedQC_k_'+D.iv;
(async function(){
 if(!window.crypto||!crypto.subtle){document.getElementById('e').textContent='افتح الرابط بمتصفح Chrome حديث.';return}
 try{var s=localStorage.getItem(KEY);if(s){await openWithKey(ub(s));return}}catch(e){try{localStorage.removeItem(KEY)}catch(x){}}
})();
document.getElementById('f').onsubmit=async function(ev){
 ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e');
 b.disabled=true;b.textContent='جاري التحقق...';e.textContent='';
 try{
  var raw=await tryLogin(document.getElementById('u').value,document.getElementById('p').value);
  if(!raw){e.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';b.disabled=false;b.textContent='دخول';return}
  if(document.getElementById('r').checked){try{localStorage.setItem(KEY,bu(raw))}catch(x){}}
  await openWithKey(raw);
 }catch(err){e.textContent='حصل خطأ: '+err.message;b.disabled=false;b.textContent='دخول'}
};
