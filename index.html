 b.disabled=false;b.textContent='دخول';

$('cp').onclick=async function(){try{await navigator.clipboard.writeText($('dev').textContent);err('تم نسخ كود الجهاز')}catch(e){err('انسخ الكود يدوياً: '+$('dev').textContent)}};
$('bk').onclick=function(){$('f2').classList.add('hidden');$('f1').classList.remove('hidden');err('')};
$('b2').onclick=async function(){
 var b=$('b2');b.disabled=true;b.textContent='جاري التفعيل...';err('');
 var code=$('act').value.trim();var raw=await fromAct(code,cur.u,cur.p);
 if(!raw){err('كود التفعيل غير صحيح أو مش لهذا الجهاز');b.disabled=false;b.textContent='تفعيل';return}
 ls(ACTK+'_'+cur.u,code);await done(raw,cur.u+' — جهاز '+devId());
};

})();
</script>
