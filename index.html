:root{--n:#1d4d2b;--o:#6aa84f;--g:#6b7280}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f2f5f1;font-family:'Cairo',-apple-system,sans-serif;color:#1f2937;font-size:15px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{background:var(--n);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}header img{height:38px;background:#fff;border-radius:7px}header b{font-size:16px;display:block}header small{font-size:11px;color:#cfe8c4}#kp{margin-right:auto;font-size:11px;text-align:left;line-height:1.4}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd}.tabs button{flex:1;border:0;background:none;padding:10px;font:inherit;color:var(--g)}.tabs button.on{color:var(--n);border-bottom:3px solid var(--o);font-weight:700}
main{padding:10px;max-width:640px;margin:auto}.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}.card h3{margin:0 0 8px;font-size:15px;color:var(--n);display:flex;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{font-size:12px;color:var(--g);display:flex;flex-direction:column;gap:2px}input,select,textarea{font:inherit;font-size:16px;padding:8px;border:1px solid #cfd5df;border-radius:9px;width:100%;background:#fff;color:#111}
.btn{background:var(--n);color:#fff;border:0;border-radius:11px;padding:12px;font:inherit;font-weight:700;width:100%}.btn.o{background:var(--o)}.btn.g{background:#e5e7eb;color:#111}.btn.r{background:#fee2e2;color:#b42318}.btn.s{padding:6px 10px;width:auto;font-size:13px}
.num{background:var(--n);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.bd{font-size:12px;padding:3px 8px;border-radius:20px;background:#eee;margin-right:auto}.bd.ok{background:#dcfce7;color:#166534}.bd.rej{background:#fee2e2;color:#991b1b}.bd.nc{background:#fef3c7;color:#92400e}.bd.inc{background:#e5e7eb}
.sl{font-size:12px;font-weight:700;color:var(--n);margin:10px 0 4px;border-top:1px dashed #ddd;padding-top:6px}.rot{display:grid;grid-template-columns:80px 1fr;gap:6px;margin-bottom:5px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph div{position:relative}.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px}.ph button{position:absolute;top:-6px;left:-6px;border:0;background:#b42318;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px}
.k4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k4 div{background:#f6f8f6;border-radius:10px;padding:8px;font-size:12px;color:var(--g)}.k4 b{display:block;font-size:20px;color:var(--n)}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px #0002;display:flex;gap:8px;z-index:6}
.note{background:#fffbea;border:1px solid #f1d38a;border-radius:9px;padding:8px;font-size:13px;line-height:1.7}.cwarn{background:#b42318;color:#fff;font-weight:700;border-radius:8px;padding:7px 10px;margin:4px 0 8px;font-size:13px}.cwarn.y{background:#fff4e5;color:#b42318;border:1.5px solid #b42318}.warn{color:#b42318;font-size:13px;margin:4px 0}
.it{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0;flex-wrap:wrap}.it b{flex:1;font-size:14px}.it small{color:var(--g);display:block;font-weight:400}
#busy{position:fixed;inset:0;background:#000a;color:#fff;display:none;align-items:center;justify-content:center;z-index:50;font-size:17px;text-align:center;padding:20px}
#stage{position:fixed;top:0;left:-20000px;width:794px;background:#fff}
#done{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}#done .card{width:100%;max-width:420px}
.wfl{color:#b45309;font-size:12px;font-weight:600}.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.hint{font-size:12px;color:#555;background:#f3f3f3;border-right:3px solid #888;padding:4px 8px;margin:2px 0 6px;border-radius:4px;width:100%}.crop{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;gap:8px;padding:10px;color:#fff}.crop .ch{font-size:14px;text-align:center}.crop .cw{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.crop .ci{position:relative;display:inline-block;line-height:0}.crop .cw img{max-width:calc(100vw - 20px);max-height:calc(100vh - 150px);display:block}.crop .cb{display:none;position:absolute;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}.crop .cr{display:flex;gap:8px;justify-content:center}</style><style id="qcss"></style>
